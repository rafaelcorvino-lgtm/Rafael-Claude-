<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meteorologia - Previsão do Tempo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <div class="app">
        <header>
            <h1>Previsão do Tempo</h1>
            <div class="search-box">
                <input type="text" id="city-input" placeholder="Digite o nome da cidade..." autocomplete="off">
                <button id="search-btn" title="Buscar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                    </svg>
                </button>
                <button id="location-btn" title="Usar minha localização">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
                    </svg>
                </button>
            </div>
            <ul id="suggestions" class="suggestions hidden"></ul>
        </header>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Carregando...</p>
        </div>

        <div id="error" class="error hidden"></div>

        <main id="weather-content" class="hidden">
            <section class="current-weather">
                <div class="location-info">
                    <h2 id="city-name"></h2>
                    <p id="current-date"></p>
                </div>
                <div class="current-main">
                    <div class="temp-icon">
                        <span id="weather-icon" class="weather-icon"></span>
                        <span id="current-temp" class="current-temp"></span>
                    </div>
                    <p id="weather-desc" class="weather-desc"></p>
                </div>
                <div class="current-details">
                    <div class="detail">
                        <span class="detail-label">Sensação</span>
                        <span id="feels-like" class="detail-value"></span>
                    </div>
                    <div class="detail">
                        <span class="detail-label">Umidade</span>
                        <span id="humidity" class="detail-value"></span>
                    </div>
                    <div class="detail">
                        <span class="detail-label">Vento</span>
                        <span id="wind" class="detail-value"></span>
                    </div>
                    <div class="detail">
                        <span class="detail-label">Precipitação</span>
                        <span id="precipitation" class="detail-value"></span>
                    </div>
                    <div class="detail">
                        <span class="detail-label">UV</span>
                        <span id="uv-index" class="detail-value"></span>
                    </div>
                    <div class="detail">
                        <span class="detail-label">Visibilidade</span>
                        <span id="visibility" class="detail-value"></span>
                    </div>
                </div>
            </section>

            <section class="radar-section">
                <h3>Radar Meteorológico</h3>
                <div class="radar-controls">
                    <button id="radar-play" title="Play/Pause">▶️</button>
                    <span id="radar-time" class="radar-time">--:--</span>
                </div>
                <div id="radar-map" class="radar-map"></div>
                <div class="radar-legend">
                    <span class="legend-label">Leve</span>
                    <div class="legend-bar"></div>
                    <span class="legend-label">Forte</span>
                </div>
            </section>

            <section class="hourly-forecast">
                <h3>Próximas Horas</h3>
                <div id="hourly-container" class="hourly-container"></div>
            </section>

            <section class="daily-forecast">
                <h3>Próximos 7 Dias</h3>
                <div id="daily-container" class="daily-container"></div>
            </section>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
